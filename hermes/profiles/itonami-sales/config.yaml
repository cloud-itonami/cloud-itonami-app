    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
  skills_hub:
    base_url: https://api.murakumo.cloud/v1
    model: mishima
    provider: murakumo
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
  approval:
    base_url: https://api.murakumo.cloud/v1
    model: mishima
    provider: murakumo
