model:
  provider: murakumo
  base_url: https://api.murakumo.cloud/v1
  default: mishima
  max_tokens: 8192
  context_length: 131072
fallback_providers: []
auxiliary:
  free_only: true
  vision:
    provider: murakumo
    base_url: https://api.murakumo.cloud/v1
    model: qwen3-vl-2b-instruct
    reasoning_effort: none
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
  web_extract:
    base_url: https://api.murakumo.cloud/v1
    model: mishima
    provider: murakumo
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
  compression:
    base_url: https://api.murakumo.cloud/v1
    model: mishima
    provider: murakumo
