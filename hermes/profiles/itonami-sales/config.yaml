    fallback_chain: []
  triage_specifier:
    base_url: https://api.murakumo.cloud/v1
    model: mishima
    provider: murakumo
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    fallback_chain: []
providers:
  murakumo:
    base_url: https://api.murakumo.cloud/v1
    api_mode: chat_completions
    stale_timeout_seconds: 600
    request_timeout_seconds: 900
    key_env: CUSTOM_PROVIDER_MURAKUMO_KEY
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
dashboard:
  turn_isolation: true
context_file_max_chars: 120000
plugins:
  enabled: []
_config_version: 46
agent:
  reasoning_effort: none
  max_turns: 500
  run_budget_seconds: 600
cron:
  bot_chat_delivery_timeout_seconds: 900
  max_parallel_jobs: 12

compression:
  threshold_tokens: 20000
  proactive_prune_tokens: 16000
  tail_mode: lean
