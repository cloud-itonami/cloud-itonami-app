name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Default required path is JVM-free emit. It does not run kbb -M:test.
# Leftover JVM suite lives in leftover-jvm-tests.yml (workflow_dispatch only).
# Do not rename that leftover into this file and pretend it is gone.

jobs:
  amu-jvm-free-emit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install nbb host
        run: npm ci
      - name: JVM-free emit + guest load (no java/clojure)
        run: bash scripts/ci-jvm-free-emit
        # No actions/setup-java. PATH is reconstructed without java/clojure.
        # kexe verify on Linux is HOLD and must not be faked as :ok.
        # bin/kotoba is this app's compile adapter, not production kotoba v0.6.29.

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.28.0
      - name: Scan Git history
        run: gitleaks git --redact --no-banner

  # Smoke-tests the Windows launch path end to end: kbb + engine + guest-wasm
  # server, first-boot health on 1338. This is the run path the resident
  # actually uses since adr-2609112000. The OLD smoke ran the JVM uberjar;
  # that path cannot boot since the cljk rename (src is .cljk; JVM
  # clojure.main reads .clj/.cljc only) — a product-level breakage tracked
  # separately, not masked by pointing this smoke at the kbb path it has
  # always exercised on Linux.
  windows-launch-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install kbb launcher + engine (pinned)
        shell: bash
        run: |
          set -euo pipefail
          KBB_SHA=a755ec25a07637bab9ab97edab1ab1257418c558
          git clone --depth 5 https://github.com/kotoba-lang/kotoba.git target/kbb
          git -C target/kbb fetch --depth 20 origin "$KBB_SHA"
          git -C target/kbb checkout --detach "$KBB_SHA"
          git clone --depth 5 https://github.com/kotoba-lang/org-babashka-nbb.git target/engine
          echo "KBB_ENGINE=$PWD/target/engine/cli.js" >> "$GITHUB_ENV"
          echo "$PWD/target/kbb/bin" >> "$GITHUB_PATH"
      - name: Install amu + emit the guest wasm
        shell: bash
        run: |
          set -euo pipefail
          AMU_SHA=8435eafb7dada2d3a85cee2c278ca6d38deb7588
          git clone --depth 5 https://github.com/kotoba-lang/amu.git target/amu-rt
          git -C target/amu-rt fetch --depth 20 origin "$AMU_SHA"
          git -C target/amu-rt checkout --detach "$AMU_SHA"
          # spawnSync cannot exec a shebang script on Windows; a .cmd shim is
          # how node launchers are made spawnable there. The shell that runs
          # it is cmd.exe, which cannot read git-bash's /d/a/... style paths,
          # so convert (measured 2026-09-13: bare $PWD path → amu died with
          # empty output; cygpath -w path → works).
          printf '@node "%%~dp0amu" %%*\n' > target/amu-rt/bin/amu.cmd
          export AMU="$(cygpath -w "$PWD/target/amu-rt/bin/amu.cmd")"
          export AMU_HOME="$(cygpath -w "$PWD/target/amu-rt")"
          export KOTOBA_EMITTER=amu
          kbb --backend sci --classpath bin bin/compile-amu
      - name: Launch and wait for /health
        shell: bash
        run: |
          set -euo pipefail
          data_dir="$PWD/target/release/ci-data"
          mkdir -p "$data_dir"
          export CLOUD_ITONAMI_DATA_DIR="$data_dir"
          export CLOUD_ITONAMI_PORT=1338
          kbb --backend sci --classpath bin bin/cloud-itonami-server &
          ok=0
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:1338/health >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 1
          done
          if [[ "$ok" != 1 ]]; then
            echo "::error::Windows launch smoke test failed: /health never returned 200"
            exit 1
          fi
          curl -fsS http://127.0.0.1:1338/health
          echo ""
          echo "Windows launch smoke test: /health returned 200 (kbb guest-wasm run path)"

